<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skullpanda 3D Viewer</title>
    <script src="https://viewer.marmoset.co/main/marmoset.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
    </style>
</head>
<body>
    <script>
        // Carica il file .mview che si trova nella stessa cartella
        marmoset.embed('tbexport.mview', { 
            width: window.innerWidth, 
            height: window.innerHeight, 
            autoStart: true, 
            fullFrame: true, 
            pagePreset: false 
        });
    </script>
</body>
</html>
